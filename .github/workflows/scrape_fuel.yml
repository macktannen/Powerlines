name: Scrape AirNav Fuel Prices

on:
  workflow_dispatch: # Allow manual trigger only

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Run Scraper
        run: python scripts/scrape_airnav.py
        
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fuel_prices.json
          if git diff --staged --quiet; then
            echo "No changes to fuel_prices.json"
          else
            git commit -m "chore: Update fuel prices via automated scraper"
            git push origin main
            git checkout gh-pages || git checkout -b gh-pages
            git merge main || echo "Nothing to merge"
            git push origin gh-pages
          fi
